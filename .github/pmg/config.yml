# PMG settings for the CI jobs of this repository. setup-pmg passes this file
# to safedep/pmg as config-file. PMG reads the keys that it does not set from
# its own template.
dependency_cooldown:
  enabled: true
  # The same window as the dependency-cooldown control of vet.
  days: 2
  # SafeDep releases these modules, and a change can need a version on the
  # day it ships. The cooldown would block that version. PMG still runs
  # malware analysis on them. List only the modules in go.mod.
  skip:
    - purl: pkg:golang/buf.build/gen/go/safedep/api/grpc/go
      reason: "SafeDep API SDK, generated by BSR"
    - purl: pkg:golang/buf.build/gen/go/safedep/api/protocolbuffers/go
      reason: "SafeDep API SDK, generated by BSR"
