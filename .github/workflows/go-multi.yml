name: Go Multi-Platform

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # PMG runs on Linux only.
      - name: Set up PMG
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-pmg
        with:
          api-key: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
          tenant-id: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN }}
          network-profile: .github/pmg/network/go-multi-test.yml

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install dependencies
        run: go mod download

      ## Here we only run tests cases that require multi-platform testing
      ## We SHOULD NOT bloat this by running all tests

      - name: Test keychain package
        run: go test -v ./keychain/...
        env:
          ## E2E tests exercise the real OS keychain. Linux CI runners lack a
          ## D-Bus session and gnome-keyring-daemon, so the Secret Service
          ## backend is unavailable. macOS and Windows runners have native
          ## keychains available out of the box.
          KEYCHAIN_ENABLE_E2E_TEST: ${{ runner.os != 'Linux' && 'true' || '' }}

      ## The policy cache renames files and sets file modes, which differ on
      ## each OS.
      - name: Test policy cache package
        run: go test -v ./cloud/configsync/...
