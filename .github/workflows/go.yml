# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up PMG
      uses: ./.github/actions/setup-pmg
      with:
        api-key: ${{ secrets.SAFEDEP_CLOUD_API_KEY }}
        tenant-id: ${{ secrets.SAFEDEP_CLOUD_TENANT_DOMAIN }}
        network-profile: .github/pmg/network/go-build.yml

    - name: Set up Go
      uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Install dependencies
      run: go mod download

    - name: Install OpenAPI Tools
      run: go install github.com/deepmap/oapi-codegen/cmd/oapi-codegen@v1.10.1

    # Docs: https://github.com/nestybox/sysbox/blob/master/docs/user-guide/install-package.md#installing-sysbox
    - name: Install sysbox-run docker host runtime
      run: |
        cd /tmp
        wget https://github.com/nestybox/sysbox/releases/download/v0.7.1/sysbox-ce_0.7.1.linux_amd64.deb
        echo "9d6d5484f980d0a17f86c492c1262015c2afb66280bdb97215b79fde6a0261c5  sysbox-ce_0.7.1.linux_amd64.deb" | sha256sum --check
        sudo apt-get update
        sudo apt-get install -y jq
        sudo apt-get install -y ./sysbox-ce_0.7.1.linux_amd64.deb

    # The fusermount3 AppArmor profile of the runner image denies the FUSE
    # mount that sysbox-fs makes for each container, so sysbox-runc fails.
    - name: Allow the FUSE mount of sysbox-fs
      run: |
        if [ -f /etc/apparmor.d/fusermount3 ]; then
          sudo apparmor_parser -R /etc/apparmor.d/fusermount3
        fi

    # Docs: https://github.com/nestybox/sysbox/blob/master/docs/user-guide/install-package.md#installing-sysbox
    - name: Check sysbox status
      run: sudo systemctl status sysbox -n20

    - name: Download Mods
      run: go mod tidy

    - name: Generate mockery mocks
      run: go tool mockery

    - name: Generate Code
      run: go generate -v ./...

    # docs/nats_test.md. The version is the production version.
    - name: Start NATS with JetStream
      run: |
        docker run -d --name nats -p 4222:4222 nats:2.12.6-alpine -js
        for i in $(seq 1 30); do
          if (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null; then
            exit 0
          fi
          sleep 1
        done
        docker logs nats
        exit 1

    # setup-pmg exports the cloud settings of the PMG of this job. The tests
    # of the cloud package read SAFEDEP_* variables, and they fail with these
    # values. The proxy keeps its own copy, so the unset does not change it.
    - name: Test Code
      run: |
        unset SAFEDEP_API_KEY SAFEDEP_TENANT_ID PMG_CLOUD_ENABLED PMG_CLOUD_AUTO_SYNC_ENABLED PMG_CLOUD_ENDPOINT_ID
        go test -v ./...
      env:
        SANDBOX_ENABLE_E2E_TEST: true
        TEST_DOCKER_SANDBOX_SOCKET_PATH: /var/run/docker.sock
        DRY_NATS_TEST_URL: nats://127.0.0.1:4222

    - name: Show sysbox logs
      if: failure()
      run: |
        sudo journalctl -u sysbox-fs -n 100 --no-pager
        sudo journalctl -u sysbox-mgr -n 100 --no-pager
        sudo dmesg | grep -i 'apparmor="DENIED"' | tail -n 20 || true

    - name: TUI discipline checks
      run: bash scripts/check-tui-discipline.sh

